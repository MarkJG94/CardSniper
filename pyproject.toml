[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardsniper"
version = "0.1.0"
description = "Watches Cardmarket (UK sellers), eBay UK and UK MTG stores for cards listed below market value and alerts you."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
camoufox = ["camoufox[geoip]>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
cardsniper = "cardsniper.cli:main"

[tool.setuptools.packages.find]
include = ["cardsniper*"]

[tool.setuptools.package-data]
cardsniper = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
